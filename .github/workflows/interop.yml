name: OpenID Federation interoperability

on:
  workflow_dispatch:
    inputs:
      lane:
        description: Interoperability lane to run
        required: true
        type: choice
        default: peer
        options:
          - peer
          - core

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  interoperability:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Follow gradle/wrapper/gradle-wrapper.properties; do not override it.
      - name: Set up Gradle from the project wrapper
        uses: gradle/actions/setup-gradle@v4

      - name: Make the Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Require a working Docker daemon
        run: docker info

      - name: Run unit tests and the selected lane
        timeout-minutes: 35
        env:
          INTEROP_LANE: ${{ inputs.lane }}
        run: |
          set -euo pipefail
          case "${INTEROP_LANE}" in
            peer)
              ./gradlew --no-daemon \
                -PopenidFederation.modules=openid-federation-interop-tests \
                :modules:openid-federation-interop-tests:test \
                :modules:openid-federation-interop-tests:interopPeerQualificationTest
              ;;
            core)
              # Core depends on installDist tasks in the public/admin server projects,
              # so use the default full project inclusion and omit the module selector.
              ./gradlew --no-daemon \
                :modules:openid-federation-interop-tests:test \
                :modules:openid-federation-interop-tests:interopCoreTest
              ;;
            *)
              echo "::error::Unsupported interoperability lane"
              exit 2
              ;;
          esac

      - name: Require passing JUnit results for selected tasks
        if: success()
        env:
          INTEROP_LANE: ${{ inputs.lane }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import sys
          import xml.etree.ElementTree as ET

          lane_tasks = {
              "peer": ("test", "interopPeerQualificationTest"),
              "core": ("test", "interopCoreTest"),
          }
          lane = os.environ.get("INTEROP_LANE", "")
          if lane not in lane_tasks:
              sys.exit("::error::Unsupported interoperability lane for JUnit validation")

          module_build = Path("modules/openid-federation-interop-tests/build")
          for task in lane_tasks[lane]:
              report_dir = module_build / "test-results" / task
              reports = sorted(report_dir.glob("TEST-*.xml"))
              if not reports:
                  sys.exit(f"::error::No JUnit XML results found for {task}")

              suites = []
              for report in reports:
                  suites.extend(ET.parse(report).getroot().iter("testsuite"))
              if not suites:
                  sys.exit(f"::error::JUnit reports contain no test suites for {task}")

              counts = {
                  name: sum(int(suite.attrib.get(name, "0")) for suite in suites)
                  for name in ("tests", "failures", "errors", "skipped")
              }
              if counts["tests"] < 1:
                  sys.exit(f"::error::{task} executed no tests")
              if any(counts[name] for name in ("failures", "errors", "skipped")):
                  sys.exit(f"::error::{task} must have passing, non-skipped results; counts={counts}")
              print(f"{task}: {counts['tests']} test(s), 0 failures, 0 errors, 0 skipped")
          PY

      - name: Upload unit and peer qualification reports
        if: always() && inputs.lane == 'peer'
        uses: actions/upload-artifact@v4
        with:
          name: peer-qualification-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            modules/openid-federation-interop-tests/build/test-results/test/*.xml
            modules/openid-federation-interop-tests/build/reports/tests/test/**
            modules/openid-federation-interop-tests/build/test-results/interopPeerQualificationTest/*.xml
            modules/openid-federation-interop-tests/build/reports/tests/interopPeerQualificationTest/**
            modules/openid-federation-interop-tests/build/interop/peer-qualification/*.json

      - name: Upload unit and core interop reports
        if: always() && inputs.lane == 'core'
        uses: actions/upload-artifact@v4
        with:
          name: core-interop-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            modules/openid-federation-interop-tests/build/test-results/test/*.xml
            modules/openid-federation-interop-tests/build/reports/tests/test/**
            modules/openid-federation-interop-tests/build/test-results/interopCoreTest/*.xml
            modules/openid-federation-interop-tests/build/reports/tests/interopCoreTest/**
            modules/openid-federation-interop-tests/build/interop/core/*.json

# Flat defaults for OpenID Federation (IDK property-file pipeline).
# Mirrors reference.conf. Precedence: AppMap/env overrides this file; this beats hardcoded OidfConfigDefaults.
oidf.federation.root.identifier=http://localhost:8080
oidf.federation.dev.mode=false
oidf.server.admin.port=8081
oidf.server.admin.host=0.0.0.0
oidf.server.federation.port=8080
oidf.server.federation.host=0.0.0.0
oidf.cors.allowed.origins=*
oidf.cors.allowed.methods=GET,POST,PUT,DELETE,OPTIONS
oidf.cors.allowed.headers=*
oidf.cors.max.age=3600
oidf.logger.severity=INFO
oidf.logger.output=TEXT
oidf.logger.include.timestamp=false
oidf.kms.default.provider=memory
oidf.identity.mode=account
oidf.identity.account.header.principal.claim=sub
oidf.identity.account.header.allowed.principals=
oidf.identity.session.alignment=account
oidf.identity.session.fixed.tenant.id=default

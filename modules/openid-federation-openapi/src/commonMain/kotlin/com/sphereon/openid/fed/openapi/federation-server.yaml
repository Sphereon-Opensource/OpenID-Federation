openapi: 3.0.3
info:
  title: OpenID Federation Server API
  description: This API exposes standardized OpenID Federation endpoints that enable entity participation within a federation through statement exchange, trust negotiation, and metadata discovery.
  contact:
    name: Sphereon
    email: info@sphereon.com
  license:
    name: Apache 2.0
    url: "http://www.apache.org/licenses/LICENSE-2.0.html"
  version: 0.25.0-1.1
servers:
  - url: http://localhost:8080
    description: Federation Server
paths:
  /status:
    get:
      tags:
        - federation
      summary: Check node status
      description: Check the status of the Federated Node.
      responses:
        '200':
          description: Successful status check
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '500':
          $ref: '#/components/responses/ServerError'
      operationId: status
  /.well-known/openid-federation:
    get:
      tags:
        - federation
      summary: Fetch Entity Statement
      description: Fetch Entity Configuration Statement.
      responses:
        '200':
          description: Successful fetch of Entity Statement
          content:
            application/entity-statement+jwt:
              schema:
                type: string
                description: A signed JWT containing the Entity Configuration Statement
              examples:
                Example 1:
                  value: eyJraWQiIwY0tSTlpnV0FqWjVBcTcyYnpSVFhDOHBCbU1DRG0tNlA0NWFHbURveVU0IiwidHlwIjoiZW50aXR5LXN0YXRlbWVudCtqd3QiLCJhbGciOiJFUzI1NiJ9..Vet8M8FZe3VSn8AsqeJyMvGP_6gC9DAOSxqzOYytzfCQrF2TmSjRb8ICRzFiP3Vt53S-KScJUrF-eDiyDw
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/ServerError'
      operationId: fetchEntityStatement
  /list:
    get:
      tags:
        - federation
      summary: List Subordinates
      description: List the entity Subordinates for the specified criteria.
      parameters:
        - name: entity_type
          in: query
          description: 'The value of this parameter is an Entity Type Identifier. If the responder knows the Entity Types of its Immediate Subordinates, the result MUST be filtered to include only those that include the specified Entity Type.'
          required: false
          schema:
            type: string
        - name: trust_marked
          in: query
          description: 'If the parameter trust_marked is present and set to true, the result contains only the Immediate Subordinates for which at least one Trust Mark have been issued and is still valid.'
          required: false
          schema:
            type: boolean
        - name: trust_mark_type
          in: query
          description: 'The value of this parameter is a Trust Mark Type identifier. If the responder has issued Trust Marks with the specified Trust Mark type, the list in the response is filtered to include only the Immediate Subordinates for which that Trust Mark type has been issued and is still valid.'
          required: false
          schema:
            type: string
        - name: intermediate
          in: query
          description: 'If the parameter intermediate is present and set to true, then if the responder knows whether its Immediate Subordinates are Intermediates or not, the result MUST be filtered accordingly.'
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: Successful fetch of Subordinates
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  format: uri
        '400':
          $ref: '#/components/responses/BadRequestError'
        '500':
          $ref: '#/components/responses/ServerError'
      operationId: listSubordinates
    post:
      tags:
        - federation
      summary: List Subordinates (POST)
      description: List the entity Subordinates for the specified criteria using POST.
      requestBody:
        required: false
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                entity_type:
                  type: string
                  description: 'Entity Type Identifier to filter by.'
                trust_marked:
                  type: boolean
                  description: 'If true, only return subordinates with valid Trust Marks.'
                trust_mark_type:
                  type: string
                  description: 'Trust Mark Type identifier to filter by.'
                intermediate:
                  type: boolean
                  description: 'If true, filter to only Intermediate entities.'
      responses:
        '200':
          description: Successful fetch of Subordinates
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  format: uri
        '400':
          $ref: '#/components/responses/BadRequestError'
        '500':
          $ref: '#/components/responses/ServerError'
      operationId: listSubordinatesPost
  /fetch:
    get:
      tags:
        - federation
      summary: Fetch Subordinate Statement
      description: Fetch the Subordinate Statement issued by a specified entity `iss` for a subordinate entity `sub`.
      parameters:
        - name: sub
          in: query
          description: The subject identifier (URI) of the entity for whom the Subordinate Statement is created.
          required: true
          schema:
            type: string
            format: uri
        - name: iss
          in: query
          description: The Entity Identifier of the issuer of the Subordinate Statement. Used to select the issuer account when multiple accounts are hosted.
          required: false
          schema:
            type: string
            format: uri
      responses:
        '200':
          description: Successful fetch of the Subordinate Statement
          content:
            application/entity-statement+jwt:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/ServerError'
      operationId: fetchSubordinateStatement
    post:
      tags:
        - federation
      summary: Fetch Subordinate Statement (POST)
      description: Fetch the Subordinate Statement issued by a specified entity `iss` for a subordinate entity `sub` using POST.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - sub
              properties:
                sub:
                  type: string
                  format: uri
                  description: The subject identifier (URI) of the entity for whom the Subordinate Statement is created.
                iss:
                  type: string
                  format: uri
                  description: The Entity Identifier of the issuer of the Subordinate Statement.
      responses:
        '200':
          description: Successful fetch of the Subordinate Statement
          content:
            application/entity-statement+jwt:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/ServerError'
      operationId: fetchSubordinateStatementPost
  /resolve:
    get:
      tags:
        - federation
      summary: Resolve Entity Statement
      description: |
        Resolve metadata and Trust Marks for an Entity (OIDFed 1.1 §8.3).
        Parameters `trust_anchor` and `entity_type` MAY be repeated. When the HTTP
        adapter joins repeated query keys, comma-separated values are also accepted.
      parameters:
        - name: sub
          in: query
          description: The Entity Identifier of the Entity whose resolved data is requested.
          required: true
          schema:
            type: string
        - name: trust_anchor
          in: query
          description: |
            Trust Anchor Entity Identifier(s) to use when resolving. MAY be repeated
            (preference order). At least one value is required by this implementation.
          required: true
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: entity_type
          in: query
          description: |
            Entity Type Identifier(s) to include in Resolved Metadata. MAY be repeated.
            If omitted, all Entity Types are returned.
          required: false
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
      responses:
        '200':
          description: Successful resolve of Entity metadata
          content:
            application/resolve-response+jwt:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequestError'
        '500':
          $ref: '#/components/responses/ServerError'
      operationId: resolveEntityStatement
    post:
      tags:
        - federation
      summary: Resolve Entity Statement (POST)
      description: |
        Resolve metadata and Trust Marks for an Entity using POST (OIDFed 1.1 §8.3).
        Form fields `trust_anchor` and `entity_type` MAY be repeated.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - sub
                - trust_anchor
              properties:
                sub:
                  type: string
                  description: The Entity Identifier of the Entity whose resolved data is requested.
                trust_anchor:
                  type: array
                  items:
                    type: string
                  description: Trust Anchor Entity Identifier(s), preference order (may be repeated).
                entity_type:
                  type: array
                  items:
                    type: string
                  description: Entity Type Identifier(s) to resolve (may be repeated).
            encoding:
              trust_anchor:
                style: form
                explode: true
              entity_type:
                style: form
                explode: true
      responses:
        '200':
          description: Successful resolve of Entity metadata
          content:
            application/resolve-response+jwt:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequestError'
        '500':
          $ref: '#/components/responses/ServerError'
      operationId: resolveEntityStatementPost
  /trust-mark:
    get:
      tags:
        - federation
      summary: Get Trust Mark
      description: Retrieve a specific Trust Mark.
      parameters:
        - name: trust_mark_type
          in: query
          description: Trust Mark Type identifier.
          required: true
          schema:
            type: string
        - name: sub
          in: query
          description: The Entity Identifier of the Entity to which the Trust Mark is issued.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful retrieval of Trust Mark
          content:
            application/trust-mark+jwt:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/ServerError'
      operationId: getTrustMark
    post:
      tags:
        - federation
      summary: Get Trust Mark (POST)
      description: Retrieve a specific Trust Mark using POST.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - trust_mark_type
                - sub
              properties:
                trust_mark_type:
                  type: string
                  description: Trust Mark Type identifier.
                sub:
                  type: string
                  description: The Entity Identifier of the Entity to which the Trust Mark is issued.
      responses:
        '200':
          description: Successful retrieval of Trust Mark
          content:
            application/trust-mark+jwt:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/ServerError'
      operationId: getTrustMarkPost
  /trust-mark-status:
    get:
      tags:
        - federation
      summary: Check Trust Mark Status
      description: |
        Check if a Trust Mark is still active (OIDFed 1.1 §8.4).
        The specification primarily defines POST; GET is supported with the same parameters
        for interoperability (query string instead of form body).
        Provide either `trust_mark` (full JWT) **or** `sub` + type (`i` or `trust_mark_type`)
        with optional `iat`.
      parameters:
        - name: trust_mark
          in: query
          required: false
          schema:
            type: string
          description: The Trust Mark JWT to check. When set, sub/type/iat are taken from claims.
        - name: sub
          in: query
          required: false
          schema:
            type: string
          description: Entity Identifier the Trust Mark was issued to (required when trust_mark omitted).
        - name: i
          in: query
          required: false
          schema:
            type: string
          description: Trust Mark Type identifier (OIDFed short name). Alias of trust_mark_type.
        - name: trust_mark_type
          in: query
          required: false
          schema:
            type: string
          description: Trust Mark Type identifier (alias of i).
        - name: iat
          in: query
          required: false
          schema:
            type: number
          description: Issued-at of the Trust Mark (NumericDate), optional disambiguator.
      responses:
        '200':
          description: Trust Mark status as a signed JWT
          content:
            application/trust-mark-status-response+jwt:
              schema:
                type: string
                description: A signed JWT containing the Trust Mark status response.
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/ServerError'
      operationId: checkTrustMarkStatus
    post:
      tags:
        - federation
      summary: Check Trust Mark Status (POST)
      description: |
        Check if a Trust Mark is still active (OIDFed 1.1 §8.4 primary method).
        Provide either `trust_mark` (full JWT) **or** `sub` + type (`i` or `trust_mark_type`)
        with optional `iat`.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                trust_mark:
                  type: string
                  description: The Trust Mark JWT to check.
                sub:
                  type: string
                  description: Subject Entity Identifier (when trust_mark omitted).
                i:
                  type: string
                  description: Trust Mark Type identifier (short name).
                trust_mark_type:
                  type: string
                  description: Trust Mark Type identifier (alias of i).
                iat:
                  type: number
                  description: Optional issued-at NumericDate.
      responses:
        '200':
          description: Trust Mark status as a signed JWT
          content:
            application/trust-mark-status-response+jwt:
              schema:
                type: string
                description: A signed JWT containing the Trust Mark status response.
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/ServerError'
      operationId: checkTrustMarkStatusPost
  /trust-mark-list:
    get:
      tags:
        - federation
      summary: List Trust Marked Entities
      description: List all Entities for which Trust Marks have been issued and are still valid.
      parameters:
        - name: trust_mark_type
          in: query
          description: 'Trust Mark Type identifier to filter by. If the responder has issued Trust Marks with the specified Trust Mark Type, the list in the response is filtered to include only the Entities for which that Trust Mark Type has been issued and is still valid.'
          required: true
          schema:
            type: string
        - name: sub
          in: query
          description: The Entity Identifier of the Entity to which the Trust Mark was issued. The list obtained in the response MUST be filtered to only the Entity matching this value.
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Successful fetch of Trust Marked Entities
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  format: uri
        '400':
          $ref: '#/components/responses/BadRequestError'
        '500':
          $ref: '#/components/responses/ServerError'
      operationId: listTrustMarkedEntities
    post:
      tags:
        - federation
      summary: List Trust Marked Entities (POST)
      description: List all Entities for which Trust Marks have been issued and are still valid using POST.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - trust_mark_type
              properties:
                trust_mark_type:
                  type: string
                  description: Trust Mark Type identifier to filter by.
                sub:
                  type: string
                  description: The Entity Identifier to filter by.
      responses:
        '200':
          description: Successful fetch of Trust Marked Entities
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  format: uri
        '400':
          $ref: '#/components/responses/BadRequestError'
        '500':
          $ref: '#/components/responses/ServerError'
      operationId: listTrustMarkedEntitiesPost
  /historical-keys:
    get:
      tags:
        - federation
      summary: Get Historical Keys
      description: Retrieve previously used keys for non-repudiation of statements.
      responses:
        '200':
          description: Successful retrieval of historical keys
          content:
            application/jwk-set+jwt:
              schema:
                type: string
        '500':
          $ref: '#/components/responses/ServerError'
      operationId: getHistoricalKeys
components:
  responses:
    BadRequestError:
      description: Invalid request parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnauthorizedError:
      description: Authentication information is missing or invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFoundError:
      description: The requested resource was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      x-tags:
        - federation
      required:
        - error
        - error_description
      properties:
        status:
          type: integer
          x-stoplight:
            id: joax1cgth4uzd
        error:
          type: string
        error_description:
          type: string
          description: A human-readable short text describing the error.
        timestamp:
          type: integer
          x-stoplight:
            id: qtn6mqbzpjctv
    StatusResponse:
      type: object
      properties:
        status:
          type: string
          description: The current status of the node.
          example: UP

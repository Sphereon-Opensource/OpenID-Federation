openapi: 3.0.3
info:
  title: OpenID Federation Admin Server API — Account REST (LEGACY optional)
  description: |
    Optional LEGACY account management operations (`GET/POST/DELETE /accounts`).

    **Packaging contract**
    - Present only when `openid-federation-account-http` is on the classpath **and**
      `identity.mode=legacy` (runtime still gates registration).
    - **Not** part of the core admin API surface for platform hosts (IDK/EDK/VDX assemblies
      that omit `account-http`).
    - Core admin operations live in `admin-server.yaml` (keys, metadata, subordinates, …).

    Models `Account`, `AccountsResponse`, and `CreateAccount` are generated into the shared
    openapi module for LEGACY code; platform hosts should not advertise these operations.
  contact:
    name: Sphereon
    email: info@sphereon.com
  license:
    name: Apache 2.0
    url: 'http://www.apache.org/licenses/LICENSE-2.0.html'
  version: 0.25.0-1.1-d4
servers:
  - url: /
    description: Admin Server
security:
  - oAuth2: [ ]
  - bearerAuth: [ ]
tags:
  - name: accounts
    description: Account management operations (LEGACY optional jar)
paths:
  /accounts:
    get:
      tags:
        - accounts
      summary: List all accounts
      operationId: listAccounts
      description: Retrieve a list of all accounts.
      parameters:
        - $ref: '#/components/parameters/AccountUsername'
      responses:
        '200':
          description: Accounts retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountsResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminErrorResponse'
    post:
      tags:
        - accounts
      summary: Register a new tenant account
      operationId: registerNewTenantAccount
      description: Endpoint for an admin to create a new account.
      parameters:
        - $ref: '#/components/parameters/AccountUsername'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccount'
      responses:
        '201':
          description: Account created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminErrorResponse'
        '409':
          description: 'Conflict (e.g., account already exists)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminErrorResponse'
    delete:
      tags:
        - accounts
      summary: Delete current account
      operationId: deleteCurrentAccount
      description: Delete the account.
      parameters:
        - $ref: '#/components/parameters/AccountUsername'
      responses:
        '200':
          description: Account deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Bearer token authentication
      bearerFormat: JWT
    oAuth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: http://localhost:8082/realms/openid-federation/protocol/openid-connect/token
          refreshUrl: http://localhost:8082/realms/openid-federation/protocol/openid-connect/token
          scopes: { }
  parameters:
    # Duplicated from core admin-server.yaml so this file is self-contained as a document.
    # Runtime still uses the same X-Account-Username header as other admin operations.
    AccountUsername:
      name: X-Account-Username
      in: header
      description: Optional account username to operate on behalf of
      required: false
      schema:
        type: string
        nullable: true
        default: 'root'
  schemas:
    AccountsResponse:
      type: object
      properties:
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/Account'
      required:
        - accounts
    Account:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: The unique identifier for the account (federation entity context).
          example: "123e4567-e89b-12d3-a456-426614174000"
        username:
          type: string
          description: The username of the account.
          example: acmecorp
        identifier:
          type: string
          description: The identifier of the account.
          format: uri
          example: "https://www.example.com/oidf"
          pattern: "^https?:\\/\\/.*$"
      required:
        - id
        - username
    CreateAccount:
      type: object
      properties:
        username:
          type: string
          description: The username of the account.
          example: acmeco
          minLength: 1
          maxLength: 32
        identifier:
          type: string
          description: The identifier of the tenant account.
          example: https://www.example.com/oidf
      required:
        - username
    # Shape mirrors core admin-server.yaml AdminErrorResponse (kept local for a self-contained doc).
    AdminErrorResponse:
      type: object
      required:
        - error
        - message
      properties:
        status:
          type: integer
        error:
          type: string
        message:
          type: string
          description: A human-readable short text describing the error.
        timestamp:
          type: integer

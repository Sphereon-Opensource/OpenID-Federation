# OpenID Federation Cache Configuration
# These are the default cache settings. Override in application.conf or environment variables.

cache {
  namespaces {
    # HTTP response caching (entity configurations, subordinate statements)
    "oidf.http-resolver" {
      locality = LOCAL_PREFERRED
      distributed-fallback = true
      write-through = false
      max-entries = 1000
      persistent = false
      ttl {
        app = 30m
        tenant = 15m
        principal = 5m
      }
      tags = ["http", "federation"]
    }

    # Entity configuration statement caching
    "oidf.entity-config" {
      locality = LOCAL_PREFERRED
      distributed-fallback = true
      write-through = false
      max-entries = 500
      persistent = false
      ttl {
        app = 1h
        tenant = 30m
        principal = 15m
      }
      tags = ["entity", "federation"]
    }

    # Trust chain resolution caching
    "oidf.trust-chain" {
      locality = LOCAL_PREFERRED
      distributed-fallback = false
      write-through = false
      max-entries = 200
      persistent = false
      ttl {
        app = 15m
        tenant = 10m
        principal = 5m
      }
      tags = ["trust-chain", "federation"]
    }

    # Trust mark verification caching
    "oidf.trust-mark" {
      locality = LOCAL_PREFERRED
      distributed-fallback = false
      write-through = false
      max-entries = 500
      persistent = false
      ttl {
        app = 10m
        tenant = 5m
        principal = 2m
      }
      tags = ["trust-mark", "federation"]
    }
  }
}

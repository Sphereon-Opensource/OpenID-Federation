# OpenID Federation Default Configuration
# All properties prefixed with 'oidf.' for namespace isolation
# These are the default values; override via environment variables or application.conf

oidf {
  # Federation core settings (APP scope)
  federation {
    root.identifier = "http://localhost:8080"
    dev.mode = false
  }

  # Server configuration (APP scope)
  server {
    admin {
      port = 8081
      host = "0.0.0.0"
    }
    federation {
      port = 8080
      host = "0.0.0.0"
    }
  }

  # Database configuration (APP scope, must be overridden for production)
  datasource {
    url = ""
    user = ""
    password = ""
    db = ""
  }

  # OAuth2 configuration (APP scope)
  oauth2 {
    issuer.uri = ""
  }

  # CORS configuration (APP scope)
  cors {
    allowed.origins = "*"
    allowed.methods = "GET,POST,PUT,DELETE,OPTIONS"
    allowed.headers = "*"
    max.age = 3600
  }

  # Logging configuration (APP scope)
  logger {
    severity = "INFO"
    output = "TEXT"
    include.timestamp = false
  }

  # KMS default provider selection
  kms {
    default.provider = "memory"
  }

  # Identity / multi-tenancy mode
  # account  = Account table + X-Account-Username + /accounts REST (default open-source)
  # external = token tenant only; no account management REST (aliases: platform, legacy→account)
  identity {
    mode = "account"
    # EXTERNAL only: token tenant id that owns federation root entity URL (not login)
    # external.root.tenant.id = "default"
    # ACCOUNT: who may send X-Account-Username (empty = nobody; * = any authn — test only)
    account.header.principal.claim = "sub"
    # account.header.allowed.principals = "ops-admin"
    account.header.allowed.principals = ""
    # L2: bind IDK session tenant to Account.id in ACCOUNT mode (account|fixed)
    session.alignment = "account"
    session.fixed.tenant.id = "default"
  }
}

# KMS Providers (IDK standard pattern)
# These follow IDK's kms.providers.<id> pattern
kms.providers {
  # Software/memory provider (development default)
  memory {
    type = "software"
    id = "memory"
    enabled = true
    order = 100
    keystore {
      type = "memory"
      id = "oidf-memory-keystore"
      keyvisibility = "private"
      scopebinding = "app"  # Use app-level shared storage across all sessions
    }
  }

  # Azure Key Vault provider (disabled by default)
  azure {
    type = "azure_keyvault"
    id = "azure"
    enabled = false
    order = 10
    hsmtype = "KEYVAULT"
    # applicationid = ""  # Set via env: AZURE_KEYVAULT_APPLICATION_ID
    # keyvaulturl = ""    # Set via env: AZURE_KEYVAULT_URL
    # tenantid = ""       # Set via env: AZURE_KEYVAULT_TENANT_ID
    credentialopts {
      credentialmode = "SERVICE_CLIENT_SECRET"
      # clientid = ""     # Set via env: AZURE_KEYVAULT_CLIENT_ID
      # clientsecret = "" # Set via env: AZURE_KEYVAULT_CLIENT_SECRET
    }
    exponentialbackoffretreopts {
      maxretries = 3
      basedelayinms = 100
      maxdelayinms = 1000
    }
  }

  # AWS KMS provider (disabled by default)
  aws {
    type = "aws_kms"
    id = "aws"
    enabled = false
    order = 10
    # region = ""         # Set via env: AWS_REGION
    # accesskeyid = ""    # Set via env: AWS_ACCESS_KEY_ID
    # secretaccesskey = "" # Set via env: AWS_SECRET_ACCESS_KEY
    maxretries = 3
    basedelayms = 100
    maxdelayms = 1000
  }
}

# Cache configuration (already defined in client reference.conf, included here for completeness)
cache {
  namespaces {
    # HTTP response caching (entity configurations, subordinate statements)
    "oidf.http-resolver" {
      locality = LOCAL_PREFERRED
      distributed-fallback = true
      write-through = false
      max-entries = 1000
      persistent = false
      ttl {
        app = 30m
        tenant = 15m
        principal = 5m
      }
      tags = ["http", "federation"]
    }

    # Entity configuration statement caching
    "oidf.entity-config" {
      locality = LOCAL_PREFERRED
      distributed-fallback = true
      write-through = false
      max-entries = 500
      persistent = false
      ttl {
        app = 1h
        tenant = 30m
        principal = 15m
      }
      tags = ["entity", "federation"]
    }

    # Trust chain resolution caching
    "oidf.trust-chain" {
      locality = LOCAL_PREFERRED
      distributed-fallback = false
      write-through = false
      max-entries = 200
      persistent = false
      ttl {
        app = 15m
        tenant = 10m
        principal = 5m
      }
      tags = ["trust-chain", "federation"]
    }

    # Trust mark verification caching
    "oidf.trust-mark" {
      locality = LOCAL_PREFERRED
      distributed-fallback = false
      write-through = false
      max-entries = 500
      persistent = false
      ttl {
        app = 10m
        tenant = 5m
        principal = 2m
      }
      tags = ["trust-mark", "federation"]
    }
  }
}

services:
  db:
    # Pin major version: postgres:latest (18+) changed the data directory layout and
    # breaks existing volumes mounted at /var/lib/postgresql/data.
    image: postgres:16
    container_name: openid-federation-datastore
    security_opt:
      - no-new-privileges:true
    env_file:
      - path: .env
        required: false
      - path: .env.local
        required: false
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-${DATASOURCE_USER}}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-${DATASOURCE_PASSWORD}}
      POSTGRES_DB: ${POSTGRES_DB:-${DATASOURCE_DB}}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - openid_network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}" ]
      interval: 3s
      timeout: 5s
      retries: 20

  openid-federation-server:
    image: sphereon/openid-federation-server:latest
    build:
      context: .
      dockerfile: ./.docker/openid-federation-server/Dockerfile
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1536M
        reservations:
          cpus: '0.5'
          memory: 768M
    ports:
      - "8080:8080"
    env_file:
      - path: .env
        required: false
      - path: .env.local
        required: false
    environment:
      - DATASOURCE_URL
        DATASOURCE_USER
        DATASOURCE_PASSWORD
        APP_KEY
        KMS_PROVIDER
        ROOT_IDENTIFIER
        DEV_MODE
        LOGGER_SEVERITY
        KMS_PROVIDERS_MEMORY_TYPE
        KMS_PROVIDERS_MEMORY_ID
        KMS_PROVIDERS_MEMORY_ENABLED
        KMS_PROVIDERS_MEMORY_ORDER
        KMS_PROVIDERS_MEMORY_KEYSTORE_TYPE
        KMS_PROVIDERS_MEMORY_KEYSTORE_ID
        KMS_PROVIDERS_MEMORY_KEYSTORE_SCOPEBINDING
        KMS_PROVIDERS_MEMORY_KEYSTORE_KEYVISIBILITY
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./logs/openid-federation-server:/tmp/logs
      # Optional file config — see application.yaml.example / docs/CONFIGURATION.md
      - ./config:/app/config:ro
    networks:
      - openid_network

  openid-federation-admin-server:
    image: sphereon/openid-federation-admin-server:latest
    build:
      context: .
      dockerfile: ./.docker/openid-federation-admin-server/Dockerfile
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1536M
        reservations:
          cpus: '0.5'
          memory: 768M
    ports:
      - "8081:8080"
    env_file:
      - path: .env
        required: false
      - path: .env.local
        required: false
    environment:
      # Pass-through host env (same pattern as federation server)
      DATASOURCE_URL: ${DATASOURCE_URL:-}
      DATASOURCE_USER: ${DATASOURCE_USER:-}
      DATASOURCE_PASSWORD: ${DATASOURCE_PASSWORD:-}
      APP_KEY: ${APP_KEY:-}
      KMS_PROVIDER: ${KMS_PROVIDER:-memory}
      ROOT_IDENTIFIER: ${ROOT_IDENTIFIER:-}
      DEV_MODE: ${DEV_MODE:-false}
      LOGGER_SEVERITY: ${LOGGER_SEVERITY:-}
      LOGGER_OUTPUT: ${LOGGER_OUTPUT:-}
      # Admin always requires a JWT issuer (startup fails if blank).
      # Prefer OIDF_* ; legacy OAUTH2_* still mapped on JVM.
      OIDF_OAUTH2_ISSUER_URI: ${OIDF_OAUTH2_ISSUER_URI:-${OAUTH2_RESOURCE_SERVER_JWT_ISSUER_URI:-http://keycloak:8080/realms/openid-federation}}
      OAUTH2_RESOURCE_SERVER_JWT_ISSUER_URI: ${OAUTH2_RESOURCE_SERVER_JWT_ISSUER_URI:-http://keycloak:8080/realms/openid-federation}
      OIDF_OAUTH2_AUDIENCE: ${OIDF_OAUTH2_AUDIENCE:-}
      OIDF_OAUTH2_JWT_AUTH_ENABLED: ${OIDF_OAUTH2_JWT_AUTH_ENABLED:-auto}
      KMS_PROVIDERS_MEMORY_TYPE: ${KMS_PROVIDERS_MEMORY_TYPE:-}
      KMS_PROVIDERS_MEMORY_ID: ${KMS_PROVIDERS_MEMORY_ID:-}
      KMS_PROVIDERS_MEMORY_ENABLED: ${KMS_PROVIDERS_MEMORY_ENABLED:-}
      KMS_PROVIDERS_MEMORY_ORDER: ${KMS_PROVIDERS_MEMORY_ORDER:-}
      KMS_PROVIDERS_MEMORY_KEYSTORE_TYPE: ${KMS_PROVIDERS_MEMORY_KEYSTORE_TYPE:-}
      KMS_PROVIDERS_MEMORY_KEYSTORE_ID: ${KMS_PROVIDERS_MEMORY_KEYSTORE_ID:-}
      KMS_PROVIDERS_MEMORY_KEYSTORE_SCOPEBINDING: ${KMS_PROVIDERS_MEMORY_KEYSTORE_SCOPEBINDING:-}
      KMS_PROVIDERS_MEMORY_KEYSTORE_KEYVISIBILITY: ${KMS_PROVIDERS_MEMORY_KEYSTORE_KEYVISIBILITY:-}
    depends_on:
      db:
        condition: service_healthy
      # Bundled Keycloak is the default JWT issuer for local compose.
      # For an external IdP: set OIDF_OAUTH2_ISSUER_URI and stop/remove the keycloak service
      # (or override depends_on). Admin will not accept unauthenticated API calls.
      keycloak:
        condition: service_healthy
    networks:
      - openid_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./logs/openid-federation-admin-server:/tmp/logs
      # Optional file config (prefer application.yaml — see application.yaml.example / docs/CONFIGURATION.md).
      # Env from env_file still overrides these keys.
      - ./config:/app/config:ro

  keycloak:
    image: keycloak/keycloak:26.0
    user: keycloak
    security_opt:
      - no-new-privileges:true
    command:
      - start-dev
      - --import-realm
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1536M
        reservations:
          cpus: '0.5'
          memory: 768M
    ports:
      - "8082:8080"
    env_file:
      - path: .env
        required: false
      - path: .env.local
        required: false
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME
      - KC_BOOTSTRAP_ADMIN_PASSWORD
      - KC_HEALTH_ENABLED
      - JAVA_OPTS
    #      - KC_BOOTSTRAP_ADMIN_USERNAME=${KC_BOOTSTRAP_ADMIN_USERNAME}
    #      - KC_BOOTSTRAP_ADMIN_PASSWORD=${KC_BOOTSTRAP_ADMIN_PASSWORD}
    #      - KC_HEALTH_ENABLED=true
    #      - JAVA_OPTS=-XX:MaxRAMPercentage=75.0 -XX:InitialRAMPercentage=50.0 -XX:+UseG1GC
    volumes:
      - ./.docker/keycloak:/opt/keycloak/data/import/
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - openid_network
    healthcheck:
      test: [ "CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000; echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost:9000\r\nConnection: close\r\n\r\n' >&3;cat <&3 | grep -q '\"status\": \"UP\"' && exit 0 || exit 1" ]
      interval: 3s
      timeout: 10s
      retries: 10
      start_period: 10s

networks:
  openid_network:
    driver: bridge

volumes:
  postgres_data:
  local_kms_data:
  logs:
